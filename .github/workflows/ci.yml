name: Build and Publish Freiburg Slides Image

on:
  push:
    branches: ['**']
    tags: ['*']
    paths:
      - '.github/workflows/ci.yml'
      - 'build-with-cursor-freiburg/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci.yml'
      - 'build-with-cursor-freiburg/**'
  workflow_dispatch:
    inputs:
      publish_sha:
        description: 'Also publish the image with the commit SHA tag'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKER_REPO: ${{ vars.DOCKER_REPO_BUILD_WITH_CURSOR_FREIBURG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        run: |
          if [[ -z "${DOCKER_USER}" ]]; then
            echo "Missing repository variable: DOCKERHUB_USERNAME"
            exit 1
          fi
          if [[ -z "${DOCKER_REPO}" ]]; then
            echo "Missing repository variable: DOCKER_REPO_BUILD_WITH_CURSOR_FREIBURG"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker tags
        id: tags
        run: |
          IMAGE="${DOCKER_USER}/${DOCKER_REPO}"
          TAG_ARGS="--tag ${IMAGE}:sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE}:${VERSION}"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_sha }}" == "true" ]]; then
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE}:${GITHUB_SHA}"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_args=${TAG_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker buildx build \
            --file build-with-cursor-freiburg/Dockerfile \
            ${{ steps.tags.outputs.tag_args }} \
            --load \
            .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: |
          github.event_name != 'pull_request' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/') ||
            github.event.inputs.publish_sha == 'true'
          )
        run: |
          docker buildx build \
            --file build-with-cursor-freiburg/Dockerfile \
            ${{ steps.tags.outputs.tag_args }} \
            --push \
            .
